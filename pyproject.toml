[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recallcam"
version = "0.1.0"
description = "RecallCam application, query, and sequential indexing scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.153.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.1",
  "httpx==0.28.1",
  "sqlalchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
  "tzdata>=2025.2",
  "boto3>=1.43,<2",
  "redis>=6,<8",
  "rq>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "black>=25,<27"]

[tool.hatch.build.targets.wheel]
packages = [
  "backend/src/recallcam_backend",
  "worker/src/recallcam_worker",
  "shared/src/recallcam_shared",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "worker/src", "shared/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["recallcam_backend", "recallcam_worker", "recallcam_shared"]

[tool.black]
target-version = ["py311"]
line-length = 100

