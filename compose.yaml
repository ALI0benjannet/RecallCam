name: ${COMPOSE_PROJECT_NAME:-recallcam}

# Infrastructure only. API, front, worker, and model servers run separately.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recallcam}
      POSTGRES_USER: ${POSTGRES_USER:-recallcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.2}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  object-storage:
    image: ${SILO_IMAGE:-pgsty/silo:RELEASE.2026-10-18T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # SILO deliberately retains upstream MINIO_* compatibility variables.
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?Copy .env.example to .env first}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${SILO_API_PORT:-9000}:9000"
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${SILO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  storage-init:
    image: ${SILO_IMAGE:-pgsty/silo:RELEASE.2026-10-18T00-00-00Z}
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${SILO_ROOT_USER:?Copy .env.example to .env first}
      S3_SECRET_ACCESS_KEY: ${SILO_ROOT_PASSWORD:?Copy .env.example to .env first}
      S3_BUCKET: ${S3_BUCKET:-recallcam}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mcli alias set local http://object-storage:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mcli mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  object_storage_data:

